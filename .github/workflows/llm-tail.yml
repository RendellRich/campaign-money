# Manual run of the LLM pass on the long tail (pipeline/llm_tail.py). Needs the repository secret ANTHROPIC_API_KEY.
# It sends the unclear employer and occupation pairs in data/llm/unclear_pairs.csv.gz to Claude Haiku 5.5 through the
# Message Batches API and uploads the labels as a workflow artifact. Nothing is committed and the site is not changed.
name: LLM long tail

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the N pairs with the most dollars (blank for all 263,879)"
        required: false
        default: "500"
      batch:
        description: "Batch id to collect instead of submitting a new one (blank to submit)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt anthropic
      - name: Run the batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          BATCH: ${{ inputs.batch }}
        run: |
          cd pipeline
          ARGS=""
          if [ -n "$LIMIT" ]; then ARGS="--limit $LIMIT"; fi
          if [ -n "$BATCH" ]; then
            python llm_tail.py collect --batch "$BATCH" $ARGS
          else
            python llm_tail.py run $ARGS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-tail-labels
          path: |
            data/llm/tail_labels.csv.gz
            data/llm/tail_run.json
            data/llm/tail_batch_id.txt
          if-no-files-found: warn
